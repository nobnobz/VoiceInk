name: Release DMG

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag to create or update, for example v1.76. Leave empty to use MARKETING_VERSION."
        required: false
        type: string
      prerelease:
        description: "Mark the GitHub release as a prerelease."
        required: false
        default: false
        type: boolean
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build and release DMG
    runs-on: macos-latest

    env:
      APP_NAME: VoiceInk
      PROJECT: VoiceInk.xcodeproj
      SCHEME: VoiceInk
      CONFIGURATION: Release
      DERIVED_DATA: ${{ github.workspace }}/.derived-data
      SPARKLE_VERSION: 2.9.1
      SIGNING_CERTIFICATE_NAME: ${{ secrets.MACOS_CERTIFICATE_NAME }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Select Xcode 26
        shell: bash
        run: |
          set -euo pipefail

          sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer
          xcodebuild -version
          swift --version

      - name: Import local signing certificate
        shell: bash
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail

          if [[ -z "${MACOS_CERTIFICATE_P12}" || -z "${MACOS_CERTIFICATE_PASSWORD}" ]]; then
            echo "MACOS_CERTIFICATE_P12 and MACOS_CERTIFICATE_PASSWORD repository secrets are required for stable local signing." >&2
            exit 1
          fi

          certificate_path="${RUNNER_TEMP}/voiceink-local-signing.p12"
          keychain_path="${RUNNER_TEMP}/voiceink-local-signing.keychain-db"

          printf '%s' "${MACOS_CERTIFICATE_P12}" | base64 --decode > "${certificate_path}"

          security create-keychain -p "${KEYCHAIN_PASSWORD}" "${keychain_path}"
          security set-keychain-settings -lut 21600 "${keychain_path}"
          security unlock-keychain -p "${KEYCHAIN_PASSWORD}" "${keychain_path}"
          security import "${certificate_path}" \
            -k "${keychain_path}" \
            -P "${MACOS_CERTIFICATE_PASSWORD}" \
            -T /usr/bin/codesign \
            -T /usr/bin/security \
            -T /Applications/Xcode_26.3.app/Contents/Developer/usr/bin/xcodebuild
          signing_identity="${SIGNING_CERTIFICATE_NAME:-VoiceInk Local Signing}"
          certificate_pem="${RUNNER_TEMP}/voiceink-local-signing.cer"
          security find-certificate -c "${signing_identity}" -p "${keychain_path}" > "${certificate_pem}"
          sudo security add-trusted-cert \
            -d \
            -r trustRoot \
            -p codeSign \
            -k /Library/Keychains/System.keychain \
            "${certificate_pem}"
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "${KEYCHAIN_PASSWORD}" \
            "${keychain_path}"
          security list-keychains -d user -s "${keychain_path}"
          security default-keychain -d user -s "${keychain_path}"
          security find-identity -v -p codesigning "${keychain_path}"
          if ! security find-identity -v -p codesigning "${keychain_path}" | grep -Fq "\"${signing_identity}\""; then
            echo "Signing identity '${signing_identity}' was not found in the temporary keychain." >&2
            exit 1
          fi

          rm -f "${certificate_path}"

      - name: Resolve release tag
        id: release
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            tag_name="${GITHUB_REF_NAME}"
          else
            tag_name="${{ inputs.tag_name }}"
          fi

          if [[ -z "${tag_name}" ]]; then
            version="$(awk -F' = ' '/MARKETING_VERSION = / { gsub(/;/, "", $2); print $2; exit }' "${PROJECT}/project.pbxproj")"
            tag_name="v${version}"
          fi

          release_name="${APP_NAME} ${tag_name}"
          dmg_name="${APP_NAME}-${tag_name#v}.dmg"

          echo "tag_name=${tag_name}" >> "${GITHUB_OUTPUT}"
          echo "release_name=${release_name}" >> "${GITHUB_OUTPUT}"
          echo "dmg_name=${dmg_name}" >> "${GITHUB_OUTPUT}"

      - name: Cache whisper.cpp XCFramework
        uses: actions/cache@v4
        with:
          path: ~/VoiceInk-Dependencies/whisper.cpp
          key: whisper-xcframework-${{ runner.os }}-${{ hashFiles('Makefile') }}
          restore-keys: |
            whisper-xcframework-${{ runner.os }}-
          save-always: true

      - name: Build whisper.cpp XCFramework
        run: make setup

      - name: Build VoiceInk.app
        shell: bash
        run: |
          set -euo pipefail

          logs_dir="${RUNNER_TEMP}/build-logs"
          xcodebuild_log="${logs_dir}/xcodebuild.log"

          mkdir -p "${logs_dir}"
          rm -rf "${DERIVED_DATA}"
          signing_identity="${SIGNING_CERTIFICATE_NAME:-VoiceInk Local Signing}"
          set +e
          xcodebuild \
            -project "${PROJECT}" \
            -scheme "${SCHEME}" \
            -configuration "${CONFIGURATION}" \
            -destination "generic/platform=macOS" \
            -derivedDataPath "${DERIVED_DATA}" \
            -xcconfig LocalBuild.xcconfig \
            CODE_SIGN_IDENTITY="${signing_identity}" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=YES \
            DEVELOPMENT_TEAM="" \
            CODE_SIGN_ENTITLEMENTS="${GITHUB_WORKSPACE}/VoiceInk/VoiceInk.local.entitlements" \
            ENABLE_HARDENED_RUNTIME=NO \
            ONLY_ACTIVE_ARCH=NO \
            SWIFT_ACTIVE_COMPILATION_CONDITIONS='$(inherited) LOCAL_BUILD' \
            build 2>&1 | tee "${xcodebuild_log}"
          xcodebuild_status="${PIPESTATUS[0]}"
          set -e

          if [[ "${xcodebuild_status}" -ne 0 ]]; then
            {
              echo "### xcodebuild failed"
              echo
              echo '```text'
              tail -n 200 "${xcodebuild_log}"
              echo '```'
            } >> "${GITHUB_STEP_SUMMARY}"
          fi

          exit "${xcodebuild_status}"

      - name: Normalize code signatures
        shell: bash
        run: |
          set -euo pipefail

          app_path="${DERIVED_DATA}/Build/Products/${CONFIGURATION}/${APP_NAME}.app"
          entitlements="${GITHUB_WORKSPACE}/VoiceInk/VoiceInk.local.entitlements"
          signing_identity="${SIGNING_CERTIFICATE_NAME:-VoiceInk Local Signing}"

          if [[ ! -d "${app_path}" ]]; then
            echo "Built app not found at ${app_path}" >&2
            exit 1
          fi

          while IFS= read -r -d '' item; do
            codesign --force --sign "${signing_identity}" --timestamp=none "${item}"
          done < <(find "${app_path}/Contents/Frameworks" \
            \( -type d -name "*.framework" -o -type d -name "*.bundle" -o -type f -name "*.dylib" \) \
            -print0)

          codesign --force --sign "${signing_identity}" --timestamp=none --entitlements "${entitlements}" "${app_path}"
          codesign --verify --deep --strict --verbose=4 "${app_path}"
          codesign --display --verbose=4 "${app_path}" 2>&1 | tee "${RUNNER_TEMP}/codesign-app.txt"
          codesign --display --verbose=4 "${app_path}/Contents/Frameworks/whisper.framework" 2>&1 | tee "${RUNNER_TEMP}/codesign-whisper.txt"

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/build-logs
            ${{ runner.temp }}/codesign-app.txt
            ${{ runner.temp }}/codesign-whisper.txt
          if-no-files-found: ignore

      - name: Package DMG
        id: package
        shell: bash
        run: |
          set -euo pipefail

          app_path="${DERIVED_DATA}/Build/Products/${CONFIGURATION}/${APP_NAME}.app"
          if [[ ! -d "${app_path}" ]]; then
            echo "Built app not found at ${app_path}" >&2
            exit 1
          fi

          staging_dir="${RUNNER_TEMP}/dmg-root"
          dmg_path="${RUNNER_TEMP}/${{ steps.release.outputs.dmg_name }}"

          rm -rf "${staging_dir}" "${dmg_path}"
          mkdir -p "${staging_dir}"
          ditto "${app_path}" "${staging_dir}/${APP_NAME}.app"
          ln -s /Applications "${staging_dir}/Applications"

          hdiutil create \
            -volname "${APP_NAME}" \
            -srcfolder "${staging_dir}" \
            -ov \
            -format UDZO \
            "${dmg_path}"

          shasum -a 256 "${dmg_path}" | tee "${dmg_path}.sha256"

          echo "dmg_path=${dmg_path}" >> "${GITHUB_OUTPUT}"
          echo "sha256_path=${dmg_path}.sha256" >> "${GITHUB_OUTPUT}"

      - name: Create Sparkle appcast
        id: sparkle
        shell: bash
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          TAG_NAME: ${{ steps.release.outputs.tag_name }}
          DMG_NAME: ${{ steps.release.outputs.dmg_name }}
          DMG_PATH: ${{ steps.package.outputs.dmg_path }}
        run: |
          set -euo pipefail

          if [[ -z "${SPARKLE_PRIVATE_KEY}" ]]; then
            echo "SPARKLE_PRIVATE_KEY repository secret is required to sign Sparkle updates." >&2
            exit 1
          fi

          sparkle_archive="${RUNNER_TEMP}/Sparkle-${SPARKLE_VERSION}.tar.xz"
          sparkle_dir="${RUNNER_TEMP}/Sparkle-${SPARKLE_VERSION}"
          private_key_path="${RUNNER_TEMP}/sparkle_private_key"
          appcast_path="${RUNNER_TEMP}/appcast.xml"

          curl -L \
            -o "${sparkle_archive}" \
            "https://github.com/sparkle-project/Sparkle/releases/download/${SPARKLE_VERSION}/Sparkle-${SPARKLE_VERSION}.tar.xz"
          mkdir -p "${sparkle_dir}"
          tar -xf "${sparkle_archive}" -C "${sparkle_dir}" --strip-components=1

          printf '%s' "${SPARKLE_PRIVATE_KEY}" > "${private_key_path}"
          chmod 600 "${private_key_path}"
          signature_fragment="$("${sparkle_dir}/bin/sign_update" "${DMG_PATH}" -f "${private_key_path}")"
          rm -f "${private_key_path}"

          short_version="${TAG_NAME#v}"
          build_version="$(awk -F' = ' '/CURRENT_PROJECT_VERSION = / { gsub(/;/, "", $2); print $2; exit }' "${PROJECT}/project.pbxproj")"
          pub_date="$(LC_ALL=C date -u '+%a, %d %b %Y %H:%M:%S %z')"
          release_url="https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG_NAME}"
          download_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG_NAME}/${DMG_NAME}"

          cat > "${appcast_path}" <<EOF
          <?xml version="1.0" encoding="utf-8"?>
          <rss version="2.0" xmlns:sparkle="http://www.andymatuschak.org/xml-namespaces/sparkle">
            <channel>
              <title>VoiceInk Updates</title>
              <link>https://github.com/${GITHUB_REPOSITORY}/releases</link>
              <description>VoiceInk updates for this fork.</description>
              <language>en</language>
              <item>
                <title>Version ${short_version}</title>
                <link>${release_url}</link>
                <sparkle:version>${build_version}</sparkle:version>
                <sparkle:shortVersionString>${short_version}</sparkle:shortVersionString>
                <pubDate>${pub_date}</pubDate>
                <enclosure
                  url="${download_url}"
                  ${signature_fragment}
                  type="application/x-apple-diskimage" />
              </item>
            </channel>
          </rss>
          EOF

          xmllint --noout "${appcast_path}"
          echo "appcast_path=${appcast_path}" >> "${GITHUB_OUTPUT}"

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.release.outputs.dmg_name }}
          path: |
            ${{ steps.package.outputs.dmg_path }}
            ${{ steps.package.outputs.sha256_path }}
            ${{ steps.sparkle.outputs.appcast_path }}

      - name: Create or update GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ steps.release.outputs.tag_name }}
          RELEASE_NAME: ${{ steps.release.outputs.release_name }}
          DMG_PATH: ${{ steps.package.outputs.dmg_path }}
          SHA256_PATH: ${{ steps.package.outputs.sha256_path }}
          APPCAST_PATH: ${{ steps.sparkle.outputs.appcast_path }}
          PRERELEASE: ${{ inputs.prerelease || false }}
        run: |
          set -euo pipefail

          if gh release view "${TAG_NAME}" >/dev/null 2>&1; then
            gh release upload "${TAG_NAME}" "${DMG_PATH}" "${SHA256_PATH}" "${APPCAST_PATH}" --clobber
          else
            release_args=(
              "${TAG_NAME}"
              "${DMG_PATH}"
              "${SHA256_PATH}"
              "${APPCAST_PATH}"
              --target "${GITHUB_SHA}"
              --title "${RELEASE_NAME}"
              --generate-notes
            )

            if [[ "${PRERELEASE}" == "true" ]]; then
              release_args+=(--prerelease)
            fi

            gh release create "${release_args[@]}"
          fi
